name: Asana SDK version

on:
  schedule:
    # GitHub cron has no biweekly interval. The script runs on alternating Mondays.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asana-sdk-version
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check the quarantine-eligible Asana Node SDK version
        if: github.event_name == 'schedule'
        run: bun run check:asana-sdk-version -- --scheduled
      - name: Check the Asana Node SDK version now
        if: github.event_name == 'workflow_dispatch'
        run: bun run check:asana-sdk-version
